<div class="ps3-card">
  <div class="ps3-head">
    {{cover}}
    <div class="ps3-main">
      <div class="ps3-kicker">
        <span class="ps3-platform">{{platform}}</span>
        {{region}}
        <span class="ps3-id">{{id}}</span>
      </div>
      <a class="ps3-name" href="{{url}}" rel="noopener noreferrer">{{name}}</a>
      {{details}}
    </div>
  </div>
  {{description}}
  {{linkBlock}}
</div>
